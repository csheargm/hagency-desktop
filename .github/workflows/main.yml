name: Hagency Desktop CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Fixtures inject SecretStore; CI must never access a runner's native vault.
  HAGENCY_NATIVE_CREDENTIAL_IO: deny

jobs:
  libraries:
    name: Hagency library workspace
    runs-on: macos-15
    # The serial all-target and feature-enabled suites can exceed two hours.
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: 4
      # Debug schema/fixture construction must not consume another test's
      # bounded inspection deadline. Concurrency scenarios remain inside tests.
      RUST_TEST_THREADS: 1
      RUST_MIN_STACK: 16777216
    defaults:
      run:
        working-directory: crates/hagency-client
    steps:
      - uses: actions/checkout@v7
      - name: JIT-line makepad checkout
        shell: bash
        working-directory: ${{ github.workspace }}
        run: if [ -f .jit/sources.sh ]; then bash .jit/sources.sh; fi
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/hagency-client -> target
      - run: brew install cmake
      - name: Check Linux qualification helper refusals without provisioning
        run: python3 native/scripts/test-qualify-linux-cgroup.py
      - name: Preserve the offline runtime peer before feature variants rebuild it
        run: |
          cargo build --locked -p hagency-runtime --features shared-context --bin hagency-managed-runtime-probe
          cp target/debug/hagency-managed-runtime-probe "$RUNNER_TEMP/hagency-library-runtime-probe"
          echo "HAGENCY_TEST_RUNTIME_PROBE=$RUNNER_TEMP/hagency-library-runtime-probe" >> "$GITHUB_ENV"
      # These two existing qualification selectors require a live qualified
      # host; their evidence cannot be supplied by a disposable CI runner.
      - run: cargo test --locked --workspace --all-targets --no-fail-fast -- --skip native_codex_real_app_server --skip native_two_agent_qualification_records_its_evidence
      - run: cargo test --locked -p hagency --features shared-budget-execution,resource-adoption --lib
      # These functional checks retain the production two-second inspection
      # deadline. Concurrent debug fixture/schema construction can exhaust it.
      - name: Check bounded empty-device inventory in isolation
        run: |
          cargo test --locked -p hagency-store --features shared-budget-execution,resource-adoption --lib domain::owner_resources::adoption::empty_device::tests:: -- --test-threads=1
  native:
    name: Native build and unit tests
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: JIT-line makepad checkout
        shell: bash
        working-directory: ${{ github.workspace }}
        run: if [ -f .jit/sources.sh ]; then bash .jit/sources.sh; fi
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            tools/hagency-script-review -> target
            crates/owner-dashboard -> target
            crates/hagency-client -> target
      - run: brew install cmake
      - run: cargo test --locked --manifest-path crates/miniapp-core/Cargo.toml
      - run: cargo test --locked --manifest-path crates/miniapp-catalog/Cargo.toml
      - run: cargo test --locked --manifest-path crates/system-apps/Cargo.toml
      - run: bash tools/package-system-apps/check.sh
      - run: python3 tools/test_package_octos.py
      - run: python3 tools/check-release-icons.py
      - run: cargo test --locked --features agent_chat,octosense-module --lib
      - name: Budget and chat regression gate
        run: python3 tools/check-hagency-regressions.py --output .run/ci-regressions
      - run: cargo build --locked --features agent_chat
      - run: cargo check --locked --no-default-features --features agent_chat
      - run: python3 tools/wechat-ux/check_i18n.py
      - run: python3 tools/check_theme_literals.py
  article-core:
    name: Portable article core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: JIT-line makepad checkout
        shell: bash
        working-directory: ${{ github.workspace }}
        run: if [ -f .jit/sources.sh ]; then bash .jit/sources.sh; fi
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/article-core
      - run: cargo test --locked --manifest-path crates/article-core/Cargo.toml
      - run: cargo test --locked --manifest-path crates/theme-contract/Cargo.toml
