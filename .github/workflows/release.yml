name: Hagency Desktop installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create the version tag and publish after all installers pass'
        type: boolean
        default: false
      platforms:
        description: 'Installer platforms (RC excludes Intel macOS)'
        type: choice
        options: [all, macos-arm64-windows]
        default: macos-arm64-windows
      verify_only:
        description: 'Validate an existing source commit without rebuilding other platforms'
        type: boolean
        default: false
      source_commit:
        description: 'Exact binary source commit, required for verification only'
        type: string
      verify_platform:
        type: choice
        options: [windows-amd64, macos-arm64]
        default: windows-amd64
      artifact_run_id:
        description: 'Reuse an installer artifact from this run; empty packages Windows from the source commit'
        type: string
      artifact_name:
        type: string
        default: candidate-installers-windows-amd64

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}-${{ inputs.verify_only && inputs.verify_platform || 'release' }}
  cancel-in-progress: false

env:
  PYTHONUTF8: 1
  PYTHONIOENCODING: utf-8
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  RUST_MIN_STACK: 16777216
  CARGO_BUILD_JOBS: 2
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  verify:
    if: inputs.verify_only
    uses: ./.github/workflows/release-verify.yml
    with:
      source_commit: ${{ inputs.source_commit }}
      platform: ${{ inputs.verify_platform }}
      artifact_run_id: ${{ inputs.artifact_run_id }}
      artifact_name: ${{ inputs.artifact_name }}
  plan:
    if: ${{ !inputs.verify_only }}
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      scope: ${{ steps.plan.outputs.scope }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: JIT-line makepad checkout
        shell: bash
        working-directory: ${{ github.workspace }}
        run: if [ -f .jit/sources.sh ]; then bash .jit/sources.sh; fi
      - id: plan
        env:
          SCOPE: ${{ inputs.platforms || 'macos-arm64-windows' }}
        run: |
          python3 tools/test-release-assets.py
          python3 tools/release-assets.py plan --scope "$SCOPE"
  regression:
    needs: plan
    name: Budget and chat regression gate
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: JIT-line makepad checkout
        shell: bash
        working-directory: ${{ github.workspace }}
        run: if [ -f .jit/sources.sh ]; then bash .jit/sources.sh; fi
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target
            tools/hagency-script-review -> target
            crates/owner-dashboard -> target
            crates/hagency-client -> target
      - run: brew install cmake
      - run: python3 tools/check-hagency-regressions.py --output .run/release-regressions
        env:
          # Fixtures inject SecretStore; tests must never reach a runner's native vault.
          HAGENCY_NATIVE_CREDENTIAL_IO: deny
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-regressions
          path: .run/release-regressions
          retention-days: 14
  package:
    needs: plan
    name: Installer (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: JIT-line makepad checkout
        shell: bash
        working-directory: ${{ github.workspace }}
        run: if [ -f .jit/sources.sh ]; then bash .jit/sources.sh; fi
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: Check version and stamp macOS bundle
        env:
          TAG: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          python3 tools/check-release-icons.py
          python3 - <<'PY'
          import os, re, plistlib
          from pathlib import Path
          version = re.search(r'^version\s*=\s*"([^"]+)"', Path('Cargo.toml').read_text(), re.M)[1]
          if os.environ['IS_TAG'] == 'true':
              assert os.environ['TAG'] == 'v' + version, 'Tag must match Desktop version'
          p = Path('packaging/macos/Info.plist')
          data = plistlib.loads(p.read_bytes())
          data.update(CFBundleIdentifier='org.hagency.desktop', CFBundleName='Hagency Desktop',
                      CFBundleDisplayName='Hagency Desktop', CFBundleShortVersionString=version.split('-')[0],
                      HagencyReleaseVersion=version,
                      CFBundleVersion=os.environ['GITHUB_RUN_NUMBER'])
          data.pop('CFBundleIconFile', None)  # Let the packager name its generated ICNS.
          p.write_bytes(plistlib.dumps(data))
          PY
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libsqlite3-dev pkg-config cmake clang libclang-dev \
            libxcursor-dev libx11-dev libasound2-dev libpulse-dev libwayland-dev \
            libxkbcommon-dev libdrm-dev libegl1 libva2 libva-drm2 libfuse2 patchelf
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake
      - name: Windows installer tools
        if: runner.os == 'Windows'
        run: choco install nsis --no-progress -y
      - uses: Swatinem/rust-cache@v2
        with:
          key: installer-${{ matrix.platform }}-${{ matrix.arch }}
          cache-on-failure: true
      - name: Install pinned packaging tools
        run: |
          cargo install cargo-packager --version 0.10.1 --locked
          cargo install robius-packaging-commands --version 0.4.1 --locked
      - name: Test Desktop before packaging
        env:
          # Same setting as the main CI workflow: fixtures inject SecretStore and
          # tests must never reach a runner's native vault. Set on the test steps
          # only, so the packaged app started later uses the real store.
          HAGENCY_NATIVE_CREDENTIAL_IO: deny
        run: |
          python3 tools/wechat-ux/check_i18n.py
          cargo test --locked -p octosense-app-contract --lib
          cargo test --locked --features agent_chat --lib
      # The engine test this step ran (device_tier_starts_on_software_adapter) belonged to
      # the earlier engine line and does not exist on this one, whose device code retries
      # without video support on a software adapter. Its D3D11 tests live in the engine's
      # own test target, which cargo cannot run from this workspace. Start-up on this
      # runner's software adapter is checked by "Install and start the packaged Desktop on
      # Windows" below, which requires three rendered sign-in frames from the installer.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare rendered installer checks
        run: |
          python3 -m pip install -r tools/release-smoke-requirements.txt
          python3 tools/test-release-image-check.py
      # Keep optimized dependencies separately: a failed test run can populate
      # the earlier immutable cache before any release compilation has happened.
      - name: Restore optimized build cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform }}-${{ matrix.arch }}
          cache-on-failure: true
      - name: Import Apple certificate for configured signed releases
        if: runner.os == 'macOS' && vars.MACOS_SIGNED_RELEASE == 'true'
        uses: ./.github/actions/import-apple-cert
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Signed and notarized macOS package
        if: runner.os == 'macOS' && vars.MACOS_SIGNED_RELEASE == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash packaging/build-macos-dmg.sh
      - name: Package installers
        if: runner.os != 'macOS' || vars.MACOS_SIGNED_RELEASE != 'true'
        env:
          FORMATS: ${{ matrix.formats }}
          # linuxdeploy AppImages must run without /dev/fuse on hosted runners.
          APPIMAGE_EXTRACT_AND_RUN: 1
        # An absolute output directory avoids cargo-packager 0.10.1 resolving
        # generated scripts twice when it changes the working directory.
        run: cargo packager --manifest-path Cargo.toml --verbose --release --out-dir "$PWD/dist" --formats "$FORMATS"
      - name: Preserve Windows candidate before installer checks
        if: runner.os == 'Windows'
        run: python3 tools/release-assets.py collect --platform windows --arch amd64
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: candidate-installers-windows-amd64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
      - name: Start the packaged Desktop on macOS
        if: runner.os == 'macOS'
        run: |
          package=$(find dist -maxdepth 1 -name '*.dmg' -print -quit)
          python3 tools/release-desktop-smoke.py --package "$package" --output .run/release-desktop-smoke
      - name: Install and start the packaged Desktop on Windows
        if: runner.os == 'Windows'
        run: |
          package=$(find dist -maxdepth 1 -name '*.exe' -print -quit)
          python3 tools/release-desktop-smoke.py --package "$package" --output .run/release-desktop-smoke
      - name: Preserve macOS candidate
        if: runner.os == 'macOS'
        env:
          ARCH: ${{ matrix.arch }}
        run: python3 tools/release-assets.py collect --platform macos --arch "$ARCH"
      - uses: actions/upload-artifact@v7
        if: runner.os == 'macOS'
        with:
          name: candidate-installers-macos-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
      - name: Collect installers and checksums
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: python3 tools/release-assets.py collect --platform "$PLATFORM" --arch "$ARCH"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: installer-checks-${{ matrix.platform }}-${{ matrix.arch }}
          path: .run/release-desktop-smoke
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish complete release
    needs: [plan, regression, package]
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: JIT-line makepad checkout
        shell: bash
        working-directory: ${{ github.workspace }}
        run: if [ -f .jit/sources.sh ]; then bash .jit/sources.sh; fi
      - name: Resolve release tag from the built source
        id: tag
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete release and write build notes
        env:
          MACOS_SIGNED: ${{ vars.MACOS_SIGNED_RELEASE }}
          SOURCE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          SCOPE: ${{ needs.plan.outputs.scope }}
        run: |
          set -euo pipefail
          python3 tools/release-assets.py verify --scope "$SCOPE"
          cd release-assets
          sha256sum --check SHA256SUMS.txt
          # shellcheck disable=SC2016
          printf 'Hagency Desktop installers built from `%s`.\n\n' "$SOURCE_SHA" > ../release-notes.md
          # shellcheck disable=SC2016
          if [[ "$SCOPE" == 'macos-arm64-windows' ]]; then
            printf 'Desktop: macOS Apple Silicon DMG and Windows x64 NSIS installer. Intel macOS is not included.\n\n' >> ../release-notes.md
          else
            printf 'Desktop: Linux amd64/arm64 DEB and AppImage, macOS Intel/Apple Silicon DMG, and Windows x64 NSIS installer.\n\n' >> ../release-notes.md
          fi
          printf 'Resource hosting is built into Hagency Desktop on macOS (Agent → Hosting). Windows background hosting is not included.\n\n' >> ../release-notes.md
          printf 'Verify downloads against `SHA256SUMS.txt`. Each build report records the exact Desktop, Client and Makepad commits.\n\n' >> ../release-notes.md
          if [[ "$MACOS_SIGNED" == true ]]; then
            printf 'macOS packages are Developer ID signed and notarized.\n' >> ../release-notes.md
          else
            printf 'macOS Desktop uses an ad-hoc signature and is not notarized; Gatekeeper may block installation.\n' >> ../release-notes.md
          fi
          printf 'Windows packages are currently unsigned.\n' >> ../release-notes.md
          printf '\n' >> ../release-notes.md
          cat ../packaging/release-notes.md >> ../release-notes.md
      - name: Upload installers and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$IS_TAG" != true ]]; then
            if gh api "repos/$GH_REPO/git/ref/tags/$TAG" > tag.json 2>/dev/null; then
              jq -e --arg sha "$SOURCE_SHA" '.object.type == "commit" and .object.sha == $sha' tag.json
            else
              gh api --method POST "repos/$GH_REPO/git/refs" \
                -f "ref=refs/tags/$TAG" -f "sha=$SOURCE_SHA"
            fi
          fi
          if gh release view "$TAG" --json isDraft > release.json 2>/dev/null; then
            jq -e '.isDraft == true' release.json
            gh release edit "$TAG" --notes-file release-notes.md
            gh release upload "$TAG" release-assets/* --clobber
          else
            args=(--draft --verify-tag --title "Hagency Desktop $TAG" --notes-file release-notes.md)
            if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$TAG" release-assets/* "${args[@]}"
          fi
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --draft=false
          else
            gh release edit "$TAG" --draft=false --latest
          fi
