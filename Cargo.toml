[package]
name = "rinx"
authors = ["OctoSense Contributors", "Kevin Boos <kevinaboos@gmail.com>", "Robius Project Maintainers"]
description = "Hagency Desktop: Matrix Project workspaces and locally managed AI Agents."
documentation = "https://github.com/hagency-org/hagency-desktop#readme"
edition = "2024" ## mostly just to allow let-chains
homepage = "https://github.com/hagency-org/hagency-desktop"
keywords = ["matrix", "chat", "client", "robius", "makepad"]
license = "Apache-2.0"
readme = "README.md"
categories = ["gui"]
repository = "https://github.com/hagency-org/hagency-desktop"
version = "0.5.0-rc.5"
metadata.makepad-auto-version = "zqpv-Yj-K7WNVK2I8h5Okhho46Q="

[dependencies]
hagency-platform = { path = "crates/hagency-client/native/hagency-platform" }
matrix-sdk-store-encryption = "=0.19.1"
matrix-sdk-sqlite = { version = "=0.19.1", default-features = false, features = ["crypto-store"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
rmp-serde = "1.3"
hagency-store = { path = "crates/hagency-client/native/hagency-store" }
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
zeroize = "1"

# Native grant-review bridge types are used by the host in every build mode.
# Original-source adoption entry points retain the Desktop feature gate below.
hagency = { path = "crates/hagency-client/native/hagency", features = ["resource-adoption"] }
hagency-core = { path = "crates/hagency-client/native/hagency-core" }
hagency-owner-dashboard = { path = "crates/owner-dashboard" }
octosense-theme-contract = { path = "crates/theme-contract", version = "0.1.0" }
rinx-system-apps = { path = "crates/system-apps" }
article-core = { path = "crates/article-core", features = ["l0"] }
rinx-answer-export = { path = "crates/answer-export" }
rinx-miniapp-core = { path = "crates/miniapp-core" }
rinx-miniapp-catalog = { path = "crates/miniapp-catalog" }
uuid = { version = "1", features = ["v4"] }
## The assistant (ADR 0007): the scoped service contract a host injects. The
## local-runtime and remote connectors are optional (`octos-local`,
## `octos-remote`), so a hosted build links no runtime of its own.
octosense-app-peers = { git = "https://github.com/OctoSense-org/OctoSense.git", rev = "98666debcf466a6322ba2f1cc5150ad7ffe5890c" }
octoscript-ui-l0 = { git = "https://github.com/OctoSense-org/Octoscript.git", rev = "dbd48cfb799551c11e30970c393777d29644a605" }
octoscript-makepad = { git = "https://github.com/OctoSense-org/Octoscript-Makepad.git", rev = "cb66de073469063abeb2a5ab2a2bbf3cdb365745" }
octoscript-widgets = { git = "https://github.com/OctoSense-org/Octoscript-Makepad.git", rev = "cb66de073469063abeb2a5ab2a2bbf3cdb365745" }
## The app contract (OctoSense ADR 0005): manifest, policy, integrity and running
## a package, by version from crates.io. Rinx names no App Hub commit, so an App
## Hub change does not force a Rinx release; the mini-app catalog client and the
## Splash sandbox are Rinx's own (crates/miniapp-catalog, src/miniapps/sandbox.rs).
octosense-app-contract = "1.2"
article-makepad = { path = "crates/article-makepad" }
## The OctoSense module contract. Only a host build uses it, and the host redirects
## all of makepad to its own prepared checkout of the same OctoSense-org/makepad
## revision (OctoSense's .sources/makepad), whatever URL a crate names it by.
makepad-app-module = { git = "https://www.github.com/OctoSense-org/makepad.git", rev = "a0ad1839c61cecbd7e83251cfb7d50d7a725ee48", optional = true }
## The HTML/CSS article preview's renderer. Branch `hagency-jit` of that repository is its main
## plus one manifest change (makepad-widgets without the `serde` feature the JIT line lacks).
makepad-html-renderer = { package = "makepad-html", git = "https://github.com/OctoSense-org/makepad-html", rev = "d5172d37e83cd7883fe7493b7beccb6c6ad3f702", optional = true, features = ["makepad"] }
# makepad-widgets = { git = "https://github.com/makepad/makepad", branch = "dev" }
# makepad-code-editor = { git = "https://github.com/makepad/makepad", branch = "dev" }

makepad-widgets = { git = "https://github.com/kevinaboos/makepad", branch = "button-grab-key-focus" }
makepad-code-editor = { git = "https://github.com/kevinaboos/makepad", branch = "button-grab-key-focus" }


robius-directories = { git = "https://github.com/project-robius/robius" }
robius-file-picker = { path = "vendor/robius-file-picker" }
robius-location    = { git = "https://github.com/project-robius/robius" }
robius-open        = { git = "https://github.com/project-robius/robius" }
robius-share       = { git = "https://github.com/project-robius/robius" }
robius-speech      = { git = "https://github.com/project-robius/robius", rev = "166991b1b18188ee2d8441f7118721cee2a0c6eb" } # the speech_to_text branch was deleted; this is its last commit (robius PR #25)
robius-use-makepad = "0.1.1" ## auto-configures all `robius-*` crates to work with Makepad.


anyhow = "1.0"
base64 = { version = "0.22.1", optional = true }
ed25519-dalek = { version = "2.2.0", optional = true }
sha2 = { version = "0.10.9", optional = true }
bitflags = "2.6.0"
blurhash = { version = "0.2.3", default-features = false }
bytesize = "2.0"
chrono = "0.4"
chrono-tz = "0.10.4"
iana-time-zone = "0.1.64"
clap = { version = "4.0.16", features = ["derive"] }
crossbeam-channel = "0.5.10"
crossbeam-queue = "0.3.8"
eyeball = { version = "0.8.8", features = ["tracing"] } # same as matrix-sdk-ui
eyeball-im = { version = "0.9.0", features = [ "tracing" ] } # same as matrix-sdk-ui
futures = "0.3"
imbl = { version = "7.0.1", features = ["serde"] } # same as matrix-sdk-ui
futures-util = "0.3"
hashbrown = { version = "0.16", features = ["raw-entry"] }
htmlize = { version = "1.0.5", features = ["unescape"] }
indexmap = "2.6.0"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg"] }
pulldown-cmark = "0.13.0"
libc = "0.2"
mime = "0.3"
mime_guess = "2.0"
linkify = "0.10.0"
matrix-sdk-base = { version = "=0.19.1" }
matrix-sdk = { version = "=0.19.1", default-features = false, features = [
    "e2e-encryption",
    "automatic-room-key-forwarding",
    "markdown",
    "sqlite",
    "bundled-sqlite",
    "sso-login",
    ## The SDK no longer registers a rustls crypto provider unless we ask for one.
    "rustls-aws-lc-rs",
] }
matrix-sdk-crypto = { version = "=0.19.1", default-features = false }
matrix-sdk-ui = { version = "=0.19.1", default-features = false }
## Use the same ruma version as what's specified in matrix-sdk's Cargo.toml.
## Enable a few extra features:
## * "compat-optional" feature to allow missing body field in m.room.tombstone event.
## * "compat-unset-avatar" feature to allow deleting the user's avatar to work properly.
## * "unstable-compat-lax-syncv5-deser" feature to tolerate deserialization failures, which we added.
## * Note: we need a feature like "compat-unset-display-name" to unset display names, but that doesn't exist yet.
##
ruma = { version = "=0.17.0", features = [
    "html-matrix",
    "compat-optional",
    "compat-unset-avatar",
    "unstable-compat-lax-syncv5-deser",
] }
blake3 = "1.8"
num_cpus = "1.17.0"
rand = "0.8.5"
rangemap = "1.5.0"
sanitize-filename = "0.6"
serde = "1.0"
emojis = { version = "=0.9.0", features = ["serde"] }
serde_json = "1.0"
thiserror = "2.0.16"
tokio = { version = "1.43.1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3.17", features = ["env-filter"] }
unicode-segmentation = "1.11.0"
url = "2.5.0"


## Dependencies for TSP support.
## Commit "f0bc4625dcd729e07e4a36257df2f1d94c81cef4" is the most recent one without the invalid change to pin serde to 1.0.219.
## See my issue here: <https://github.com/openwallet-foundation-labs/tsp/issues/237>.
## However, that commit doesn't build.... yikes. So we have to use a slightly older commit in the "rev" field below.
tsp_sdk = { git = "https://github.com/openwallet-foundation-labs/tsp.git", rev = "1cd0cc9442e144ad7c01ccd30daffbb3a52c0f20", optional = true, features = [
    "async",
    "resolve",
] }
quinn = { version = "0.11", default-features = false, optional = true }
## We only include this such that we can specify the prebuilt-nasm feature,
## which is required to build this on Windows x86_64 without having to install NASM separately.
aws-lc-rs = { version = "1.13", optional = true, features = ["prebuilt-nasm"] }
percent-encoding = { version = "2.3", optional = true }
## The following reqwest 0.12 features were taken from the tsp_sdk's `Cargo.toml` file.
## This is only needed for the optional TSP feature; the matrix-sdk uses reqwest 0.13 internally,
## which is re-exported as `matrix_sdk::reqwest` and used by regular (non-TSP) Rinx code.
reqwest = { version = "0.12", default-features = false, optional = true, features = [
    "rustls-tls-native-roots",
    "json",
    "stream",
    "charset",
    "http2",
    "macos-system-configuration",
] }

[dev-dependencies]
wiremock = "=0.6.5"
tempfile = "3.24.0"
# Host unit tests use dashboard snapshots without enabling fixtures in production.
hagency-owner-dashboard = { path = "crates/owner-dashboard", features = ["fixtures"] }
# Native writer fixtures must never acquire the user's installation authority.
hagency = { path = "crates/hagency-client/native/hagency", features = ["test-support"] }

[[example]]
name = "article_editor_review"
required-features = ["onboarding-test-support"]

## For OAuth/SSO login on iOS, via `ASWebAuthenticationSession`. Ugh....
[target.'cfg(target_os = "ios")'.dependencies]
robius-web-auth-session = { git = "https://github.com/project-robius/robius" }

## On Android, the matrix-sdk no longer sets up TLS roots for rustls by default,
## so we have to do it manually.
[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1"

# AWS-LC has no pregenerated ABI bindings for OpenHarmony.
[target.'cfg(target_env = "ohos")'.dependencies]
aws-lc-rs = { version = "1.13", features = ["bindgen"] }
napi-derive-ohos = "0.0.9"
napi-ohos = "0.1.3"


## Article editor on desktop: pasting images and picking several images at once.
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
arboard = { version = "3.4", default-features = false, features = ["image-data"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
# The jit line: AppKit calls go through upstream's shared Apple bindings (the fork exposed them
# as makepad_platform::os::apple::apple_sys and os::apple_util).
makepad-apple-sys = { path = ".sources/makepad/libs/apple_sys" }

[target.'cfg(any(target_os = "macos", target_os = "windows", all(target_os = "linux", not(target_env = "ohos"))))'.dependencies]
dark-light = "2"


[features]
# Native-only original-source adoption; confirmation still belongs to the owner.
resource-adoption = ["hagency/resource-adoption"]
# Managed execution requires the signed-in owner, adopted device, exact grants
# and matching central deployment support; compiling it grants no authority.
shared-execution = ["resource-adoption", "hagency/shared-execution"]
shared-successors = ["shared-execution", "hagency/shared-successors"]
# Durable Matrix intake requires paired central discovery and native custody.
shared-intake = ["shared-successors", "hagency/shared-intake"]
# Bounded delivered-thread context needs the matching server capability.
shared-context = ["shared-intake", "hagency/shared-context"]
# Approved additive budgets need paired v3 execution and original-event recovery.
agent-budget = ["shared-execution", "hagency/agent-budget"]
shared-budget-execution = ["agent-budget", "shared-context", "hagency/shared-budget-execution"]
# Explicit isolated instrumentation binary; never part of production defaults.
onboarding-test-support = ["resource-adoption", "hagency/test-support", "hagency-owner-dashboard/fixtures"]
owner-accessibility = ["hagency-owner-dashboard/native-accessibility"]
# Isolated local accounts exist only in instrument builds.
palpo-instrument = []
# Ordinary Hagency Desktop builds include the native management and worker flow.
# Instrumentation and isolated fixture support remain explicit opt-ins above.
default = ["standalone", "agent_chat", "shared-budget-execution"]
## The standalone app's entry point (window, menus, `app_main!`). A host that
## links Rinx as a module disables it.
standalone = ["octos-local", "octos-remote"]
## Standalone Octos modes (ADR 0007). `octos-local`: Rinx owns one local
## kernel (the packaged `octos` next to the executable, never one on PATH),
## started on the first authorized AI request and stopped on exit.
## `octos-remote`: an explicitly configured remote octos server.
octos-local = ["octosense-app-peers/octos-core"]
octos-remote = ["octosense-app-peers/ws"]
## Rinx as an OctoSense app module (`rinx::module::RINX_MODULE`).
octosense-module = ["dep:makepad-app-module"]
## Experimental CPU HTML/CSS article preview; the native editor stays available.
html_preview = ["dep:makepad-html-renderer"]
# Compatibility for existing Rinx build commands.
article_blitz = ["html_preview"]
## Enables experimental support for using TSP wallets.
tsp = ["dep:tsp_sdk", "dep:quinn", "dep:aws-lc-rs", "dep:percent-encoding", "dep:reqwest"]

## Enables experimental support for the agent-chat / hagency control plane
## (<https://github.com/hagency-org/hagency>): native owner-approval cards for
## `com.agentchat.approval.*` events, agent puppet presentation, companion
## bridge-bot invites, and the workflow slash-commands offered in rooms that
## contain a `*_coordinator` agent. Included by default. Approval cards do not require the workflow preference;
## only workflow slash-command suggestions use Settings → Preferences.
agent_chat = ["dep:base64", "dep:ed25519-dalek", "dep:sha2"]
## Opt in to testing the pinned, unreleased Hagency Agent Operations contract.
## Production agent_chat builds retain the release gate.
agent_ops_dev = ["agent_chat"]

## Hides the command prompt console/log window on Windows.
## This is enabled automatically for packaged builds via cargo-packager
## (see `build.rs`), but you can also enable it manually if desired.
hide_windows_console = []

## Logs all diffs received by the Matrix RoomListService.
log_room_list_diffs = []

## Logs all diffs to all room timelines.
log_timeline_diffs = []

## Logs all diffs received by the Matrix SpaceService.
log_space_service_diffs = []


[[example]]
name = "palpo_action_room"
required-features = ["palpo-instrument"]

[patch.crates-io]
# Keep direct Ruma types on the same official revision as the SDK.
ruma = { git = "https://github.com/ruma/ruma", rev = "caf1ac05a9fd347158b60505ef8546a2ff18ae7c" }
ruma-client-api = { git = "https://github.com/ruma/ruma", rev = "caf1ac05a9fd347158b60505ef8546a2ff18ae7c" }
ruma-common = { git = "https://github.com/ruma/ruma", rev = "caf1ac05a9fd347158b60505ef8546a2ff18ae7c" }
ruma-events = { git = "https://github.com/ruma/ruma", rev = "caf1ac05a9fd347158b60505ef8546a2ff18ae7c" }
ruma-html = { git = "https://github.com/ruma/ruma", rev = "caf1ac05a9fd347158b60505ef8546a2ff18ae7c" }
ruma-identifiers-validation = { git = "https://github.com/ruma/ruma", rev = "caf1ac05a9fd347158b60505ef8546a2ff18ae7c" }
ruma-macros = { git = "https://github.com/ruma/ruma", rev = "caf1ac05a9fd347158b60505ef8546a2ff18ae7c" }
# Official upstream prepared-key API; package version 0.19.1 predates this Git interface.
matrix-sdk = { git = "https://github.com/matrix-org/matrix-rust-sdk.git", rev = "61905c3e46496340fad7faa6c5f77b8f363d88e7" }
matrix-sdk-base = { git = "https://github.com/matrix-org/matrix-rust-sdk.git", rev = "61905c3e46496340fad7faa6c5f77b8f363d88e7" }
matrix-sdk-common = { git = "https://github.com/matrix-org/matrix-rust-sdk.git", rev = "61905c3e46496340fad7faa6c5f77b8f363d88e7" }
matrix-sdk-crypto = { git = "https://github.com/matrix-org/matrix-rust-sdk.git", rev = "61905c3e46496340fad7faa6c5f77b8f363d88e7" }
matrix-sdk-indexeddb = { git = "https://github.com/matrix-org/matrix-rust-sdk.git", rev = "61905c3e46496340fad7faa6c5f77b8f363d88e7" }
matrix-sdk-sqlite = { git = "https://github.com/matrix-org/matrix-rust-sdk.git", rev = "61905c3e46496340fad7faa6c5f77b8f363d88e7" }
matrix-sdk-store-encryption = { git = "https://github.com/matrix-org/matrix-rust-sdk.git", rev = "61905c3e46496340fad7faa6c5f77b8f363d88e7" }
matrix-sdk-ui = { git = "https://github.com/matrix-org/matrix-rust-sdk.git", rev = "61905c3e46496340fad7faa6c5f77b8f363d88e7" }

# Octos' existing OpenHarmony ioctl ABI correction for rustyline's nix 0.29.
nix = { git = "https://github.com/octos-org/octos.git", rev = "deb433e9a452c03d8fe7f4f6a26b42785c47ced7" }
# Pending additive App Hub contract release; see vendor/octosense-app-contract/RINX-PATCH.md.
octosense-app-contract = { path = "vendor/octosense-app-contract" }
## This is required to avoid a version conflict on the libsqlite3-sys crate,
## which is a native crate that can only exist once in the dependency graph.
## The `matrix-sdk` crate's dependencies require a specific version of `libsqlite3-sys`
## (via rustsqlite which requires libsqlite3-sys 0.38),
## whereas the `tsp_sdk` crate depends on `sqlx`, which requires a different version
## of `libsqlite3-sys` (via `aries-askar`, which depends on `askar-storage`,
## which requires libsqlite3-sys 0.30.0).
## So this patch is a custom version of sqlx 0.8.6 that updates the libsqlite3-sys
## dependency to version 0.38, which is compatible with the version required by
## the matrix-sdk crate.
## See <https://github.com/launchbadge/sqlx/pull/3928/files#diff-4f4849707ed063bc5de6d9f6d105f0e7baf62d1085b3c8aee4a547468b89248fR57>
sqlx = { git = "https://github.com/project-robius/sqlx.git", branch = "update_libsqlite3-sys_version" }

## The main branch of the `tsp_sdk` repo already includes this patch, so we copy it here.
## This is required for the askar repos to work with the above-patched `sqlx` crate.
## See <https://github.com/openwallet-foundation/askar/pull/386>
askar-storage = { git = "https://github.com/openwallet-foundation/askar.git" }


[build-dependencies]
rinx-system-apps = { path = "crates/system-apps" }
# The jit line runs build scripts without a C compiler unless --allow-c: blake3 in pure Rust.
blake3 = { version = "1.8", features = ["pure"] }
serde_json = "1"
toml = "1"

## On Windows, use the `winresource` crate to embed the app's icon and metadata into the executable.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"


[package.metadata.docs.rs]
all-features = true

## Keep dev builds small: line tables are enough for backtraces and dependencies
## get no debug info. Incremental compilation is left at cargo's default (on):
## `rinx` is one 167k-line crate, and without it every edit recompiles all of it
## (37 s against 10 s for a one-line change, measured 2026-11-06). A build host
## that must cap disk use turns it off in its own ~/.cargo/config.toml and sets
## CARGO_INCREMENTAL=1 in the shell that edits; see AGENTS.md, "Build footprint".
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
debug = false
strip = "symbols"

## An optimized profile for development, with full debug info and assertions.
[profile.debug-opt]
inherits = "dev"
opt-level = 3

## An optimized release profile with thin LTO.
[profile.release-lto]
inherits = "release"
lto = "thin"

## Enable full optimizations when building app bundles for distribution.
[profile.distribution]
inherits = "release"
codegen-units = 1
lto = "fat"

## For very fast compilation, not for creating an actual high-quality executable.
## This is primarily useful for CI builds.
[profile.fast]
inherits = "dev"
opt-level = 0
debug = false
lto = "off"
strip = true
debug-assertions = false
incremental = false



## Configuration for cargo makepad (`cargo makepad android build-aab`).
## The `[package.metadata.packager]` section below already sets the package ID
## and product name, so we just need a version code for Google Play Store builds.
[package.metadata.makepad.android]
## Specifying "auto" will set it to a format like 'YYYYMMDDHH'.
version_code = "auto"


## Rinx has some plist keys that need to be merged into Makepad's generated iOS Info.plist.
[package.metadata.makepad.ios]
info_plist = "packaging/ios/Info.additions.plist"


## Configuration for `cargo packager`
[package.metadata.packager]
product_name = "Hagency Desktop"
identifier = "org.hagency.desktop"
category = "SocialNetworking"
authors = [
    "Project Robius <contact@robius.rs>",
    "Kevin Boos <kevinaboos@gmail.com>",
]
publisher = "Hagency"
license_file = "LICENSE"
copyright = "Copyright 2023-2026, Project Robius"
homepage = "https://github.com/hagency-org/hagency-desktop"
### Note: there is an 80-character max for the one-line summary.
description = "Matrix Project workspaces and locally managed AI Agents"
### Note: there is an 80-character max for each line of the `long_description`.
long_description = """
Hagency Desktop is a native Matrix messenger derived from Robrix, written in Rust
using the Makepad UI framework (https://github.com/makepad/makepad)
and the Project Robius app dev framework and platform abstractions
(https://github.com/project-robius).
Hagency Desktop connects Matrix workspaces, locally managed AI Agents,
and shared resources. This release supports macOS Apple Silicon and Windows x64.
"""
icons = [
    "./resources/icon.icns",
    "./resources/icon_32.png",
    "./resources/icon_48.png",
    "./resources/icon_64.png",
    "./resources/icon_128.png",
    "./resources/icon_256.png",
    "./resources/icon_512.png",
    "./resources/icon_1024.png",
    "./resources/icon.ico",
]
out_dir = "./dist"
# One pinned local assistant runtime; installed beside Rinx by the packager.
external-binaries = ["./dist/runtime/octos"]

## Here, we define the list of resource directories for both Makepad and Rinx.
## The `src` directory is based on `./dist/` as the `out_dir` (above), which is where the
## `robius-packaging-commands` tool outputs the resources that it discovers after each build.
## See the README from the `robius-packaging-commands` repo for more details.
resources = [
    # Makepad resources
    { src = "./dist/resources/makepad_widgets", target = "makepad_widgets" },
    # Rinx resources and inherited license notices
    { src = "./LICENSE", target = "licenses/LICENSE" },
    { src = "./LICENSE-MIT", target = "licenses/LICENSE-MIT" },
    { src = "./NOTICE", target = "licenses/NOTICE" },
    { src = "./dist/runtime/licenses/octos-LICENSE", target = "licenses/octos-LICENSE" },
    { src = "./dist/resources/rinx", target = "rinx" },
]

## We use the `robius-packaging-commands` tool to build the entire Rinx app project,
## which properly configures the release build settings for each target platform
## (e.g., it sets the `MAKEPAD`/`MAKEPAD_PACKAGE_DIR` env vars to the appropriate value).
## Every line ends in a TOML `\`, so this reaches the shell as one line: Windows
## runs it through `cmd /C`, which rejects a command split across lines.
## Note: `geoclue-2.0` has to be declared by hand. It's a D-Bus service that `robius-location`
## talks to over a socket, so there's no linked library or dlopen'd soname for the tool to find.
before-each-package-command = """
robius-packaging-commands before-each-package \
    --force-makepad \
    --binary-name rinx \
    --path-to-binary ./target/release/rinx \
    --add-deb-dep geoclue-2.0 && \
python3 tools/package-octos.py desktop"""

