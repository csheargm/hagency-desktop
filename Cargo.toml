[package.metadata.packager.macos]
minimum_system_version = "11.0"
frameworks = []
info_plist_path = "./packaging/macos/Info.plist"
entitlements = "./packaging/macos/Entitlements.plist"
# Local/RC builds have a complete ad-hoc signature. The signed release script
# replaces it with the configured Developer ID before notarization.
signing_identity = "-"


## Configuration for `cargo packager`'s generation of a macOS `.dmg`.
[package.metadata.packager.dmg]
background = "./packaging/macos/dmg-background.png"
window_size = { width = 960, height = 540 }
app_position = { x = 200, y = 250 }
application_folder_position = { x = 760, y = 250 }


## Configuration for `cargo packager`'s generation of a Windows `.exe` setup installer.
[package.metadata.packager.nsis]
installer_icon = "./resources/icon.ico"
## See this: <https://nsis.sourceforge.io/Docs/Chapter4.html#varconstant>
appdata_paths = [
    "$APPDATA/$PUBLISHER/$PRODUCTNAME",
    "$LOCALAPPDATA/$PRODUCTNAME",
]

[lints.rust]
keyword_idents_2024 = "forbid"
non_ascii_idents = "forbid"
non_local_definitions = "forbid"
unsafe_op_in_unsafe_fn = "forbid"
unnameable_types = "warn"
unused_import_braces = "warn"

## Configuration for clippy lints.
[lints.clippy]
blocks_in_conditions = "allow"
collapsible_if = "allow"
collapsible_else_if = "allow"
doc_overindented_list_items = "allow"
module_name_repetitions = "allow"
needless_late_init = "allow"
too_many_arguments = "allow"
uninlined_format_args = "allow"
used_underscore_binding = "allow"

# Pin one Makepad and Octoscript runtime across Rinx and its transitive kits.
# Includes PR #132's Windows multi-window fixes and the software-device startup fix.
# Redirect older source URLs to this exact revision while upstream merge is pending.

# The JIT line (makepad `work`, HAL + relax): OctoSense-org/makepad `hagency-jit`, checked
# out at .sources/makepad by `.jit/sources.sh` at the commit `.jit/sources.lock` pins
# (git-ignored; compat/ keeps the fork crate names). Every URL the graph names makepad by
# resolves to that one checkout. It is a checkout, not a git dependency, because the JIT
# runner is built from the same tree. See .jit/NOTES.md.
[patch."https://www.github.com/OctoSense-org/makepad.git"]
makepad-script = { path = ".sources/makepad/platform/script" }
makepad-script-compute = { path = ".sources/makepad/platform/script/compute" }
makepad-widgets = { path = ".sources/makepad/widgets" }
makepad-code-editor = { path = ".sources/makepad/code_editor" }
makepad-app-module = { path = ".sources/makepad/libs/app_module" }
makepad-studio-protocol = { path = ".sources/makepad/platform/studio" }
makepad-network = { path = ".sources/makepad/platform/network" }
makepad-wm-api = { path = ".sources/makepad/libs/wm_api" }
makepad-ai-services = { path = ".sources/makepad/libs/ai/services" }
makepad-strict-json = { path = ".sources/makepad/libs/strict_json" }
makepad-markdown = { path = ".sources/makepad/compat/makepad-markdown" }
makepad-markdown-widgets = { path = ".sources/makepad/compat/makepad-markdown-widgets" }

