[package]
name = "hagency-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
test-support = ["dep:tempfile"]
# A developer's run of this program under the Makepad JIT runner starts its
# helper processes from a native build named in HAGENCY_NATIVE_HELPER (see
# `helper_executable`). Never part of a distributed build.
development-native-helper = []

[dependencies]
tempfile = { workspace = true, optional = true }
cap-std.workspace = true
cap-fs-ext.workspace = true
getrandom.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
rustix = { workspace = true, features = ["process", "event", "pipe", "net", "fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSData", "NSString"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_IO", "Win32_UI_Shell", "Win32_System_SystemServices", "Wdk_Storage_FileSystem", "Wdk_System_SystemServices"] }
tokio = { workspace = true, features = ["io-util", "net"] }

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
