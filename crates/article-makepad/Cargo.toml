[package]
name = "article-makepad"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Reusable native Makepad article editing and viewing widgets"

[workspace]

[dependencies]
makepad-markdown-widgets = { git = "https://www.github.com/OctoSense-org/makepad.git", rev = "a0ad1839c61cecbd7e83251cfb7d50d7a725ee48", features = ["full", "editormd"] }
article-core = { path = "../article-core" }
makepad-widgets = { git = "https://github.com/kevinaboos/makepad", branch = "button-grab-key-focus" }
unicode-segmentation = "1.11.0"
libc = "0.2"

# The JIT line: this workspace builds against the same pinned makepad checkout as the
# Desktop root (`.jit/sources.sh` puts it at .sources/makepad; see .jit/NOTES.md), so the
# widgets and the renderer are one makepad whichever manifest is built.
[patch."https://github.com/kevinaboos/makepad"]
makepad-widgets = { path = "../../.sources/makepad/widgets" }

[patch."https://www.github.com/OctoSense-org/makepad.git"]
makepad-widgets = { path = "../../.sources/makepad/widgets" }
makepad-markdown = { path = "../../.sources/makepad/compat/makepad-markdown" }
makepad-markdown-widgets = { path = "../../.sources/makepad/compat/makepad-markdown-widgets" }
